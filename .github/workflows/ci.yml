name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test_eval.db
          SYNC_DATABASE_URL: sqlite:///./test_eval.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests -v
