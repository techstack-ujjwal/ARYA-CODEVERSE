services:
  # -----------------------------------------------------------
  # 1. FastAPI Backend API Core
  # -----------------------------------------------------------
  - type: web
    name: eval-engine-api
    env: python
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && playwright install --with-deps chromium || true
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: "eval-engine-hackathon"

  # -----------------------------------------------------------
  # 2. Next.js Minimalist Frontend
  # -----------------------------------------------------------
  - type: web
    name: eval-engine-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: eval-engine-api
          property: host
        transform: https://${host}/api/v1
